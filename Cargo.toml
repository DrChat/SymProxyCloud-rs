[package]
name = "symproxycloud"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.89"
async-trait = "0.1.83"
axum = { version = "0.7.5", features = ["tower-log", "macros"] }
bitflags = "2"
azure_core = "1.0.0"
azure_identity = "1.0.0"
azure_storage_blob = "1.0.0"
base64 = "0.22.1"
clap = { version = "4.5.17", features = ["derive"] }
clap-verbosity-flag = "2.2.1"
figment = { git = "https://github.com/SergioBenitez/Figment.git", version = "0.10.19", features = ["toml", "env"] }
form_urlencoded = "1.2.1"
futures = "0.3.30"
reqwest = { version = "0.12.7", default-features = false, features = ["default-tls", "charset", "stream"]}
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
serde = { version = "1.0.210", features = ["derive"] }
sha2 = "0.10.8"
thiserror = "1.0.63"
tokio = { version = "1.40.0", features = ["macros", "process", "rt-multi-thread"] }
tokio-stream = "0.1.16"
tokio-util = { version = "0.7.12", features = ["io"] }
tower-http = { version = "0.5.2", features = ["trace"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.20"
url = { version = "2.5.2", features = ["serde"] }
uuid = "1.10.0"
ms-pdb = "0.1"
object_store = { version = "0.14", default-features = false }
