# The address to listen on for incoming requests.
listen_address = "127.0.0.1:5000"

# Must be set to true in order to listen on non-loopback addresses.
#
# Think carefully before you enable this setting. The symbol servers are
# authenticated for a reason, and this application is not designed to
# authenticate incoming requests nor will it ever do so.
# Ensure that you have either properly firewalled this application, or
# set up a layer in front of the application (such as nginx) that can
# authenticate incoming requests.
i_am_not_an_idiot = false

# BETA: PDB filter. Rejects upstream PDBs that do not match certain criteria.
#
# This ONLY works if the upstream server supports RFC 7233 (range requests). If a filter
# is set and this is not supported, PDBs will not be served from the upstream source.
#
# NOTE: This filter is _NOT_ retroactively applied to PDBs that have already been cached.
# If you apply a more strict filter, you should clear your cache manually.
#
# Valid values:
#   any        - Verify PDB exists and is valid (symchk /pf) - default
#   private    - Require private symbols and line data (the most strict validation)
#   stripped   - Verify PDB is stripped of source line, data type, and global info (symchk /ps)
#   has_types  - Verify PDB contains data type information (symchk /pt)
pdb_filter = "any"

# Negotiate for the compressed PDB (PDZ / MSFZ) container format by sending
# `Accept: application/msfz0` to upstream symbol servers
#
# When a response contains `x-ms-symbol-format: application/msfz0`, the file is treated as a PDZ and is cached under the
# symsrv PDZ client key rather than the PDB key, so the two do not collide.
#
#   ntdll.pdb/<index>/ntdll.pdb         MSF
#   ntdll.pdb/<index>/msfz0/ntdll.pdb   MSFZ
#
# An empty or absent `x-ms-symbol-format` means an ordinary PDB.
#
# Set this to false if your clients cannot consume PDZ files.
#request_pdz = true

# The `User-Agent` presented to upstream symbol servers.
#user_agent = "Microsoft-Symbol-Server/10.0.0.0 SymProxyCloud/0.0.0"

# Maximum number of retries for transient upstream request failures (default: 4)
#max_retries = 4

# Optional settings to configure symbol caching.
#[cache]

# Cache using an Azure storage account as the backing store.
# MI authentication is the only mode supported, so you must grant the
# application's identity access to your storage account.
#type = "azure"
# The name of the storage account to use as a cache.
#storage_account = ""
# The container within the storage account to use.
#storage_container = ""

# Cache using the filesystem as the backing store.
#type = "fs"
#path = "./symstore"

[[servers]]
# The upstream symbol server.
url = "https://msdl.microsoft.com/download/symbols"

# Server authentication settings.
# Omit this parameter to use a server that supports unauthenticated access.
#[servers.auth]
# The scope of the token. Typically looks like `api://XXXX.../.default`
#scope = ""

# You can include any number of additional symbol servers.
# The proxy tool will try them in order when serving symbol requests.
#[[servers]]
#url = "..."
